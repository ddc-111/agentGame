name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  server-build:
    name: Server - Build, Vet & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: server/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test all packages with race detector
        run: |
          set -o pipefail
          go test ./... -v -count=1 -timeout 180s -race 2>&1 | tee test-output.log

      - name: Upload server test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-output
          path: server/test-output.log
          if-no-files-found: error
          retention-days: 3

  client-build:
    name: Client - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  gm-build:
    name: GM Editor - Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: gm/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (when configured)
        run: npm run lint --if-present

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  agent-check:
    name: Python Agent - Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python sources
        run: python -m compileall -q agent
